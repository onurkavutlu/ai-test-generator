spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:file:${java.io.tmpdir}/ai-test-generator-local/testgen;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

llm:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:300}

notification:
  email:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}

management:
  health:
    mail:
      enabled: false

test-generator:
  observation:
    # GEÇİCİ: mobil-test kurumsal CA zinciri yerel JDK truststore'unda olmadığı için
    # yalnızca local profilde sertifika zinciri doğrulamasını kapatır.
    # Kurumsal CA truststore'a eklenince false yapılmalıdır.
    insecure-ssl: ${OBSERVATION_INSECURE_SSL:true}
    rendered-dom:
      # Lokal geliştirmede görünür, JavaScript sonrası DOM da gözlemlenir. Üretimde
      # yalnızca izole bir Selenium Grid ile RENDERED_DOM_OBSERVATION_ENABLED=true açın.
      enabled: ${RENDERED_DOM_OBSERVATION_ENABLED:true}
    flow-discovery:
      # Yalnızca kullanıcı tarafından istenen, yan etkisiz akış adımları doğrulanır.
      enabled: ${FLOW_DISCOVERY_ENABLED:true}
  seeding:
    enabled: true
  selenium:
    # Lokal geliştirmede testler GÖRÜNÜR tarayıcıda koşar (Docker/CI profilinde headless kalır).
    # Kapatmak için: SELENIUM_HEADLESS=true
    headless: ${SELENIUM_HEADLESS:false}
  output:
    base-path: ${TEST_OUTPUT_PATH:${java.io.tmpdir}/generated-tests}
    karate-path: ${TEST_OUTPUT_PATH:${java.io.tmpdir}/generated-tests}/karate
    selenium-path: ${TEST_OUTPUT_PATH:${java.io.tmpdir}/generated-tests}/selenium
    restassured-path: ${TEST_OUTPUT_PATH:${java.io.tmpdir}/generated-tests}/restassured
    allure-results: ${TEST_OUTPUT_PATH:${java.io.tmpdir}/generated-tests}/allure-results
    allure-report: ${TEST_OUTPUT_PATH:${java.io.tmpdir}/generated-tests}/allure-report

logging:
  level:
    com.testgen: INFO
