server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: ai-test-generator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/testgen}
    username: ${DB_USER:testgen}
    password: ${DB_PASS:testgen}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # Önceki Hibernate yönetimli veritabanlarında schema history yoktur. 0'a
    # baseline alındıktan sonra V1 legacy backfill'i çalışır; boş veritabanında
    # ise V1 güvenle no-op olur ve mevcut bootstrap davranışı korunur.
    baseline-on-migrate: true
    baseline-version: "0"
    baseline-description: Legacy Hibernate schema
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:testgen@local.dev}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          connectiontimeout: 5000
          timeout: 10000

# ── LLM: Default Ollama (OpenAI key gerekmez) ─────────────────
llm:
  provider: ${LLM_PROVIDER:ollama}
  openai:
    # Anahtar yalnız çalışma ortamından/secrets manager'dan gelir; repoda veya
    # varsayılan konfigürasyonda sahte dahi olsa bir anahtar tutulmaz.
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4-turbo-preview}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    temperature: 0.2
    max-tokens: 4096
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:llama3.1}
    temperature: 0.1
    timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:900}
    # Bağlam penceresi. Gözlem katmanı gerçek yanıt gövdelerini prompt'a eklediği için
    # prompt'lar 34.000+ karaktere (~10k token) çıkabiliyor; 8192'de kalınca Ollama
    # fazlasını sessizce kırpıyor ve model talimatı görmeden açıklama metni döndürüyordu.
    # Bellek kısıtlı ortamlarda düşürülebilir (llama3.1 131.072 token'a kadar destekler).
    num-ctx: ${OLLAMA_NUM_CTX:16384}
    num-predict: ${OLLAMA_NUM_PREDICT:2048}

test-generator:
  observation:
    # Üretim/Docker varsayılanı güvenlidir. Yalnızca kontrollü test ortamında açın.
    insecure-ssl: ${OBSERVATION_INSECURE_SSL:false}
    rendered-dom:
      # Headless tarayıcı, hedefin JavaScript'ini çalıştırır. Bu nedenle production'da
      # açık bir opt-in'dir; izole Selenium Grid kullanımı tavsiye edilir. Kapalıysa
      # mevcut ham HTML gözlemi aynen devam eder.
      enabled: ${RENDERED_DOM_OBSERVATION_ENABLED:false}
      timeout-seconds: ${RENDERED_DOM_OBSERVATION_TIMEOUT_SECONDS:15}
    flow-discovery:
      # Kullanıcı yolunu tıklayarak doğrulama production'da ayrıca açık opt-in'dir.
      # Render edilmiş DOM gözlemi etkin olsa bile bu kapalı kalır.
      enabled: ${FLOW_DISCOVERY_ENABLED:false}
      max-steps: ${FLOW_DISCOVERY_MAX_STEPS:3}
  generation:
    # Bir istekte üretilecek varsayılan en fazla case sayısı.
    # 0 = sınır yok (Swagger'daki her endpoint için case üretilir).
    # İstekteki "maxCases" alanı verilirse HER ZAMAN bunu ezer; alan zorunlu değildir.
    default-max-cases: ${DEFAULT_MAX_CASES:0}
  agents:
    # Ajan katmani genisligi: LEAN = yalnizca cikitisi test uretiminde kullanilan ajanlar,
    # FULL = onerilen ajanlar + yonetici ozeti de kosar (daha pahali).
    mode: ${AGENT_MODE:LEAN}
  comparer:
    # Yanit govdesi farklarini yorumlayan ajan (yalnizca fark VARSA cagrilir).
    agent-enabled: ${COMPARER_AGENT_ENABLED:true}
  output:
    base-path: ${TEST_OUTPUT_PATH:/tmp/generated-tests}
    karate-path: ${TEST_OUTPUT_PATH:/tmp/generated-tests}/karate
    selenium-path: ${TEST_OUTPUT_PATH:/tmp/generated-tests}/selenium
    restassured-path: ${TEST_OUTPUT_PATH:/tmp/generated-tests}/restassured
    allure-results: ${TEST_OUTPUT_PATH:/tmp/generated-tests}/allure-results
    allure-report: ${TEST_OUTPUT_PATH:/tmp/generated-tests}/allure-report
  runner:
    timeout-seconds: 300
    parallel-threads: 4
    # Self-healing: başarısız bir test case en fazla kaç kez iyileştirilmeye çalışılsın
    max-heal-attempts: 3
    # Tek turda en fazla kaç case onarılsın. Her case 2 LLM çağrısı demek; sınırsız
    # bırakıldığında büyük bir başarısızlık kümesi LLM'i tekeline alıp yeni üretimleri
    # aç bırakıyor. Sınır dışı kalanlar deneme hakkı harcamadan sonraki tura kalır.
    max-heal-batch: ${MAX_HEAL_BATCH:10}
  selenium:
    browser: ${SELENIUM_BROWSER:chrome}
    headless: ${SELENIUM_HEADLESS:true}
    remote-url: ${SELENIUM_REMOTE_URL:}

notification:
  email:
    enabled: ${EMAIL_NOTIFICATIONS_ENABLED:true}
    from: ${EMAIL_FROM:testgen@local.dev}
    from-name: "AI Test Generator"
    default-recipients: ${EMAIL_RECIPIENTS:team@local.dev}
    subject-prefix: "[AI-TestGen]"
    allure-report-url: ${ALLURE_REPORT_URL:http://localhost:8888}
    # Uygulamanın kendi adresi — e-postadaki Cucumber rapor linki bununla kurulur
    app-base-url: ${APP_BASE_URL:http://localhost:8080}
    # Cucumber HTML raporu e-postaya ek olarak iliştirilir
    attach-report: ${EMAIL_ATTACH_REPORT:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

logging:
  file:
    name: logs/application.log
  level:
    com.testgen: DEBUG
    org.springframework: INFO

# ── Scheduler ────────────────────────────────────────────
scheduler:
  daily-run:
    # Her gün saat 02:00'de otomatik koşar
    # Test için: "0 */5 * * * *" → her 5 dakikada bir
    cron: ${SCHEDULER_CRON:0 0 2 * * *}
