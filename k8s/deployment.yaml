---
# ─────────────────────────────────────────────────────────
# Namespace
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: ai-test-generator
  labels:
    app: ai-test-generator

---
# ─────────────────────────────────────────────────────────
# ConfigMap – Ortam değişkenleri (secret olmayanlar)
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-test-generator-config
  namespace: ai-test-generator
data:
  LLM_PROVIDER: "openai"
  OPENAI_MODEL: "gpt-4-turbo-preview"
  OPENAI_BASE_URL: "https://api.openai.com/v1"
  SELENIUM_HEADLESS: "true"
  SELENIUM_BROWSER: "chrome"
  TEST_OUTPUT_PATH: "/tmp/generated-tests"
  DB_URL: "jdbc:postgresql://postgres-svc:5432/testgen"

---
# ─────────────────────────────────────────────────────────
# Secret – API Key ve DB şifresi
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-generator-secrets
  namespace: ai-test-generator
type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_WITH_REAL_KEY"
  DB_USER: "testgen"
  DB_PASS: "testgen_secure_pass"

---
# ─────────────────────────────────────────────────────────
# Deployment
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-test-generator
  namespace: ai-test-generator
  labels:
    app: ai-test-generator
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-test-generator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ai-test-generator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: ai-test-generator-sa
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ai-test-generator
          image: registry.ocp.local/testgen/ai-test-generator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: ai-test-generator-config
            - secretRef:
                name: ai-test-generator-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - name: test-output
              mountPath: /tmp/generated-tests
      volumes:
        - name: test-output
          emptyDir: {}

---
# ─────────────────────────────────────────────────────────
# Service
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: ai-test-generator-svc
  namespace: ai-test-generator
spec:
  selector:
    app: ai-test-generator
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: ClusterIP

---
# ─────────────────────────────────────────────────────────
# OpenShift Route (veya K8s Ingress)
# ─────────────────────────────────────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-test-generator-route
  namespace: ai-test-generator
spec:
  host: ai-test-generator.apps.ocp.local
  to:
    kind: Service
    name: ai-test-generator-svc
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ─────────────────────────────────────────────────────────
# ServiceAccount
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-test-generator-sa
  namespace: ai-test-generator

---
# ─────────────────────────────────────────────────────────
# HorizontalPodAutoscaler
# ─────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-test-generator-hpa
  namespace: ai-test-generator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-test-generator
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ─────────────────────────────────────────────────────────
# PostgreSQL Deployment (dev/test için)
# Prod'da managed DB kullanın
# ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ai-test-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: testgen
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ai-test-generator-secrets
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-test-generator-secrets
                  key: DB_PASS
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  namespace: ai-test-generator
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ai-test-generator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
