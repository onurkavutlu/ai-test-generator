apiVersion: 1

providers:
  - name: testgen
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    # Dosya degistiginde 10 saniyede bir yeniden yuklenir — panel duzenlerken
    # konteyneri yeniden baslatmaya gerek yok.
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
